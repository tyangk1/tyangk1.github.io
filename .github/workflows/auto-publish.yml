name: Auto publish

# Kéo nội dung từ database ra file, và commit nếu có gì đổi.
#
# VÌ SAO CẦN: site là tĩnh. Sửa bài ở trang admin đã deploy thì database đổi nhưng
# HTML thì không — phải chạy `pnpm sync` rồi build lại. Từ trình duyệt không chạy
# được lệnh, nên việc đó phải do CI làm.
#
# Commit ở đây KHÔNG kích hoạt được CI. GitHub cố ý không chạy workflow cho push
# tạo bởi `GITHUB_TOKEN`, để một workflow commit rồi tự kích hoạt lại chính nó
# không thành vòng lặp vô hạn. Đã trả giá để biết: bài đầu tiên đi qua đường này
# nằm trong repo mà 404 trên site, và không có workflow run nào cho commit đó.
#
# Nên job `deploy` bên dưới gọi thẳng `build-and-deploy.yml` — cùng đúng các bước mà
# workflow Deploy dùng, không phải bản copy. Nó chỉ chạy khi bước trên thật sự
# commit, nên nhịp cron 20 phút không sinh ra lần deploy vô ích nào.
#
# ĐÂY CŨNG LÀ THỨ LÀM ĐẶT LỊCH HOẠT ĐỘNG.
#
# Bài để ngày ở tương lai bị RLS ẩn khỏi khoá công khai, nên `pnpm sync` bên dưới
# không thấy và không ghi ra file. Tới 00:00 ngày đó theo giờ Việt Nam, policy bắt
# đầu trả bài về; lần chạy kế tiếp thấy nó, ghi file, commit, và Deploy đưa lên
# site. Không ai phải bấm gì.
#
# Hệ quả: độ trễ của đặt lịch = nhịp cron. Bài hẹn 00:00 thường lên trong khoảng
# 00:00–00:20, và có thể muộn hơn vì cron của GitHub hay trễ khi máy bận. Nếu cần
# đúng phút thì cách này không làm được — nhưng với blog thì không cần.
# ┌─────────────────────────────────────────────────────────────────────────────┐
# │ TOÀN BỘ PHẦN TRÊN MÔ TẢ CÁCH LÀM CŨ. ĐỌC KHỐI NÀY TRƯỚC.                    │
# └─────────────────────────────────────────────────────────────────────────────┘
#
# Trang bài, trang chủ, tag, RSS, sitemap và ảnh OG giờ ĐỌC DATABASE LÚC CÓ REQUEST.
# Nghĩa là sửa bài không cần sync, không cần commit, không cần build, không cần deploy —
# trang đổi ở lần tải kế tiếp, chậm nhất là sau 60 giây cache CDN.
#
# Nên workflow này KHÔNG còn là đường đăng bài. Việc nó còn làm được là kéo nội dung từ
# database ra `src/content/blog/*.mdx`, và những file đó giờ chỉ dùng cho hai bộ kiểm
# (`check:content` và ảnh chụp vàng của `check:renderer`) — tức là việc của người phát
# triển, không phải việc của người đọc.
#
# CRON ĐÃ TẮT, và đây là lý do: nó gọi `build-and-deploy.yml`, mà workflow đó giờ dừng có
# chủ ý vì GitHub Pages không chạy được máy chủ. Để cron chạy nghĩa là CI đỏ 20 phút một
# lần — và một CI đỏ đều đặn là cách nhanh nhất dạy người ta bỏ qua CI, kể cả lúc nó đỏ
# vì lý do thật.
#
# Chạy tay khi cần đồng bộ file: tab Actions → Run workflow. Xoá hẳn workflow này thì đợi
# sau khi Vercel chạy ổn, để còn đường lùi.
on:
  # schedule:
  #   - cron: '*/20 * * * *'

  # Bấm chạy ngay — giờ là cách duy nhất workflow này chạy.
  workflow_dispatch:

  # Nút "Đăng ngay" trong admin.
  #
  # Database gọi thẳng GitHub qua `rpc/request_deploy` (pg_net, token trong Supabase
  # Vault). Nhờ vậy khỏi chờ nhịp cron: sửa xong bấm một cái là bài lên trong khoảng
  # 60–90 giây — đó là thời gian sync + build + deploy, đã đo trên chính repo này.
  #
  # Vẫn giữ cron vì nó GỘP: sửa một bài là nhiều lần Lưu, và không ai muốn 10 lần deploy
  # cho 10 lần Lưu. Cron là lưới an toàn tự động; nút là lúc nói "xong rồi, lên đi".
  repository_dispatch:
    types: [publish-now]

concurrency:
  group: tu-dong-publish
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    # `contents: write` để commit được. Không xin thêm quyền nào — job deploy bên
    # dưới tự khai quyền riêng của nó.
    permissions:
      contents: write

    # Job deploy cần biết CÓ commit hay không, và commit nào. Không có `sha` thì nó
    # phải checkout `main` và sẽ đẩy lên bất cứ thứ gì đang ở đó lúc đó — kể cả
    # commit của người khác vừa đẩy lên xen vào giữa.
    outputs:
      da-commit: ${{ steps.commit.outputs.da-commit }}
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cài dependency
        run: pnpm install --frozen-lockfile

      # Dùng KHOÁ CÔNG KHAI, không phải service_role.
      #
      # Đồng bộ chỉ cần đọc bài đã đăng, dự án và lượt xem — khoá công khai đọc
      # được cả ba (đã kiểm: 8 bài kèm content đầy đủ, 4 dự án). Đặt khoá
      # service_role vào Actions là mở rộng chỗ nó có thể rò rỉ mà chẳng được gì.
      - name: Đồng bộ từ database
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
        run: pnpm sync

      # Kiểm TRƯỚC khi commit, không phải sau.
      #
      # Đường này không đi qua CI, nên nếu không kiểm ở đây thì nội dung sai sẽ nằm
      # trên main rồi mới vỡ ở bước build — và lúc đó mọi lần deploy sau đều đỏ cho
      # tới khi có người vào sửa tay. Chặn ở đây thì main luôn build được.
      - name: Kiểm nội dung
        run: pnpm check:content

      - name: Commit nếu nội dung đổi
        id: commit
        run: |
          if [ -z "$(git status --porcelain src/content src/data)" ]; then
            echo "Không có gì đổi. Thoát."
            echo "da-commit=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content src/data
          git commit -m "Đồng bộ nội dung từ database (tự động)"
          git push

          echo "da-commit=true" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Đã commit $(git rev-parse --short HEAD). Job deploy sẽ đẩy đúng commit này."

  # Chỉ chạy khi bước trên thật sự commit. Nhờ `if` này mà nhịp cron 20 phút không
  # sinh ra lần deploy nào khi không có gì đổi.
  deploy:
    needs: sync
    if: needs.sync.outputs.da-commit == 'true'

    permissions:
      contents: read
      pages: write
      id-token: write

    uses: ./.github/workflows/build-and-deploy.yml
    with:
      ref: ${{ needs.sync.outputs.sha }}
