name: CI

# Chặn code hỏng trước khi nó lên production. Cùng bộ kiểm tra với `pnpm check:all`
# chạy ở máy, nên không có chuyện "ở máy tôi chạy được".
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Push liên tiếp lên cùng một nhánh thì huỷ lần chạy cũ, khỏi tốn phút CI.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cài dependency
        run: pnpm install --frozen-lockfile

      - name: Kiểm định dạng
        run: pnpm format:check

      - name: Kiểm kiểu dữ liệu
        run: pnpm typecheck

      # `build:ci`, KHÔNG phải `build`.
      #
      # `pnpm build` chạy db-sync trước, và nó cố tình vỡ khi không nối được
      # database — đúng cho máy của người viết, vì deploy âm thầm bằng nội dung cũ
      # là loại lỗi tệ nhất. Nhưng database chạy cục bộ nên CI không bao giờ với
      # tới; đặt `pnpm build` ở đây thì CI đỏ vĩnh viễn.
      #
      # Nội dung đã được commit (xem .gitignore), nên CI build thẳng từ file.
      #
      # Truyền y hệt bộ biến của deploy.yml. Không phải để CI cần chúng, mà để CI
      # build ĐÚNG thứ mà deploy sẽ build: thiếu ở đây thì check:html chạy trên một
      # bản HTML khác với bản lên production, và những lỗi chỉ xuất hiện khi bật
      # giscus hoặc newsletter sẽ lọt qua CI rồi mới vỡ ở site thật.
      - name: Build
        env:
          # Adapter Node, không phải Vercel.
          #
          # `pnpm check:ssr` cần một máy chủ gọi được bằng HTTP để đi qua từng route —
          # adapter Vercel không sinh `dist/server/entry.mjs` để chạy như vậy. Thiếu dòng
          # này thì bộ kiểm đó không có chỗ đứng, và mất lưới an toàn của toàn bộ phần
          # chạy lúc request. Vercel tự build bằng adapter mặc định của nó.
          BUILD_ADAPTER: node
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}
        run: pnpm build:ci

      - name: Kiểm frontmatter mọi bài viết
        run: pnpm check:content

      - name: Kiểm HTML đã build
        run: pnpm check:html

      # Giữ cho renderer runtime không lệch khỏi hình dạng mà đường MDX sinh ra.
      # `Callout.astro` và `render-content.ts` mô tả cùng một hộp bằng hai đoạn code;
      # sửa một bên mà quên bên kia thì bài đổi hình dạng và không có gì báo.
      - name: Kiểm renderer khớp ảnh chụp vàng
        run: pnpm check:renderer

      # Trang bài không còn là file trong `dist/` nên `check:html` không thấy nó nữa.
      # Bước này dựng máy chủ SSR và gọi từng route bài để kiểm alt ảnh, id trùng,
      # mục lục và thẻ meta — phần vùng phủ đã mất khi bỏ prerender.
      - name: Kiểm route chạy lúc request
        run: pnpm check:ssr

      - name: Đưa bản build sang job deploy
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist
          retention-days: 1

      # Giữ lại bản build để tải về xem khi CI đỏ mà ở máy lại xanh.
      - name: Lưu bản build khi thất bại
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-loi
          path: dist
          retention-days: 3
