name: Build and deploy

# Workflow GỌI LẠI ĐƯỢC. Không tự chạy — chỉ chạy khi workflow khác `uses:` nó.
#
# VÌ SAO TÁCH RA
#
# Có hai đường dẫn tới việc deploy, và chúng không thể dùng chung một trigger:
#
#   1. Người đẩy commit  ->  CI  ->  Deploy   (workflow_run)
#   2. Cron đồng bộ nội dung từ database, tự commit
#
# Đường 2 KHÔNG kích hoạt được đường 1. GitHub cố ý không chạy workflow cho push
# tạo bởi `GITHUB_TOKEN` — để một workflow commit rồi tự kích hoạt lại chính nó
# không thành vòng lặp vô hạn. Nên cron commit xong là hết: CI không chạy, Deploy
# không chạy, site không đổi. Đã trả giá để biết: bài đầu tiên đi qua đường cron
# nằm trong repo mà 404 trên site, và không có workflow run nào cho commit đó.
#
# Ba cách sửa, chọn cách thứ ba:
#
#   Đẩy bằng PAT thay vì GITHUB_TOKEN — chạy được, nhưng thêm một credential phải
#     giữ và phải xoay, chỉ để lách một cơ chế an toàn.
#   Cho Deploy chạy sau MỌI lần cron xong — cron chạy mỗi 20 phút và phần lớn lần
#     không có gì đổi, thành 72 lần deploy mỗi ngày đẩy đi cùng một nội dung.
#   Tách phần deploy ra đây, để cron tự gọi CHỈ KHI nó thật sự commit. Không thêm
#     credential, không có lần deploy vô ích.
on:
  workflow_call:
    inputs:
      ref:
        description: Commit hoặc branch cần build và đẩy lên Pages.
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Không cho hai lần deploy chồng nhau, kể cả khi tới từ hai workflow khác nhau
    # — đó chính là lý do nhóm này đặt ở đây chứ không ở từng workflow gọi.
    # `cancel-in-progress: false` vì huỷ giữa lúc đang publish có thể để Pages ở
    # trạng thái nửa vời.
    concurrency:
      group: pages
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Build lại từ đầu chứ không tải artifact của CI.
      #
      # Cân nhắc ở đây: tải artifact thì nhanh hơn ~1 phút, nhưng phải gọi API để
      # tìm artifact đúng lần chạy — thêm một chỗ có thể sai âm thầm và đẩy lên bản
      # build của commit cũ. Build lại mất một phút và không bao giờ đẩy sai commit.
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Cài dependency
        run: pnpm install --frozen-lockfile

      # `build:ci`, không phải `build` — xem chú thích trong ci.yml.
      #
      # Các biến PUBLIC_* được đọc lúc BUILD (import.meta.env trong src/env.ts),
      # không phải lúc chạy. `.env` thì nằm trong .gitignore, nên nếu không truyền
      # ở đây thì bản deploy sẽ thiếu hết và ba tính năng tự tắt ÂM THẦM: bình
      # luận, đếm lượt xem, newsletter. Site vẫn xanh, vẫn build, chỉ là mất tính
      # năng mà không có lỗi nào để lần ra.
      #
      # Dùng `vars` chứ không phải `secrets`: đây là giá trị công khai, giscus in
      # thẳng chúng vào HTML. Đặt vào secrets chỉ tạo cảm giác an toàn giả, và
      # GitHub sẽ che chúng trong log làm việc debug khó hơn.
      - name: Build
        env:
          PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
          PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
          PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY }}
          PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_UMAMI_SRC: ${{ vars.PUBLIC_UMAMI_SRC }}
          PUBLIC_UMAMI_WEBSITE_ID: ${{ vars.PUBLIC_UMAMI_WEBSITE_ID }}
          PUBLIC_NEWSLETTER_ACTION: ${{ vars.PUBLIC_NEWSLETTER_ACTION }}
        run: pnpm build:ci

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
